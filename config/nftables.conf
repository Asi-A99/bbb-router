#!/usr/sbin/nft -f

flush ruleset

define LAN    = "end0"
define OFFICE = "end0.10"
define GUEST  = "end0.20"
define WAN    = "enx00e8004fc6eb"

table inet filter {
	chain input {
        	type filter hook input priority filter; policy drop;
        	ct state established,related accept
        	iifname "lo" accept
		iifname $GUEST udp dport { 53, 67 } accept
		iifname $GUEST tcp dport 53 accept
        	iifname $GUEST tcp dport 22 counter drop
		iifname { $LAN, $OFFICE } accept
        	ip protocol icmp accept
        	meta l4proto ipv6-icmp accept
	}
	chain forward {
        	type filter hook forward priority filter; policy drop;
        	ct state established,related accept
        	iifname $GUEST oifname $OFFICE counter drop
		iifname { $LAN, $OFFICE, $GUEST } oifname $WAN accept
	}
	chain output {
		type filter hook output priority filter;
	}
}

table ip nat {
    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;
        oifname "enx00e8004fc6eb" masquerade
    }
}
