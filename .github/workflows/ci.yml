name: ci
on: [push, pull_request]
jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y clang llvm libbpf-dev gcc-arm-linux-gnueabihf nftables python3-pytest
      - name: Check nftables syntax
        run: sudo nft -c -f config/nftables.conf
      - name: Build C tool
        run: gcc -Wall -Wextra -Werror -O2 -o bbr-links tools/bbr-links.c
      - name: Build XDP program
        run: clang -O2 -g -target bpf -I/usr/include/$(uname -m)-linux-gnu -c bpf/xdp_count.c -o xdp_count.o
      - name: Cross-build Rust tool
        run: |
          rustup target add armv7-unknown-linux-gnueabihf
          cd tools/bbr-top && cargo build --release --target armv7-unknown-linux-gnueabihf
      - name: Namespace tests
        run: sudo python3 -m pytest -v -m "not hardware" tests/
